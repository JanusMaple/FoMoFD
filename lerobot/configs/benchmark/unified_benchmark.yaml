methods:
- wm_nc
- wm_pe
- wm_pu
- logpzo
- rnd
- logpzo_native
- rnd_native
- ace
calibrations:
- episode
- wall_time_bin
wall_time_bin:
  bin_seconds: 1.0
fusion:
  wm_views: true
  conditional_marginal: true
  operations:
  - and
  - or
wm_pu:
  num_samples: 16
  sample_batch_size: 1
  precision: float32
  # TF32-enabled float32 matmuls: ~3x faster with <0.04% probe score deviation.
  # Use highest to reproduce full-precision matmuls. Stored in cache/report identity.
  matmul_precision: high
ace:
  num_samples: 32
  sample_batch_size: 4
  horizon: null
  cell_size_factor: 0.05
  min_cell_width: 1.0e-06
  action_coordinates: cumulative_delta_xyz
