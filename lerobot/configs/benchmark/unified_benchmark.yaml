# Paths are relative to the repo root; model scorer YAMLs use lerobot/ as before.
# Draft inference adapters: run --dry-run first. Model loading requires --allow-inference.
# Native checkpoints must have completed training; pending entries are shown in dry-run.
# Both protocols use RAW scores (window=1), without temporal smoothing.
# Both metric and latency protocols retain every valid scored endpoint.
# Historical reports retain their recorded replay_legacy configuration.
# WM-PU = mean coordinate SD over FM-WM endpoint samples, conditioned on executed
# actions and therefore timestamped at the endpoint. Ward-inspired, not their model.
# ACE = joint XYZ histogram entropy summed across the ACT chunk, z ~ N(0,I),
# both policy cameras. Default deployed ACT uses z=0: this is a sampling adaptation.
# Histograms use accumulated fixed-frame delta translations, expert workspace widths,
# and a full ACT horizon (null). Sample settings are explicit pilot choices, not tuned.
# time_varying = separate CP thresholds per elapsed-wall-time bin. This comparison
# does NOT control full-episode FAR at alpha. Fewer than 19 calibration episodes
# in a bin at alpha=.05 => +inf threshold. Never pad or normalize by final duration.
# Simple AND/OR uses component thresholds, same raw frame, sign-preserving margins.
# OR can increase FAR (up to 2*alpha by union bound under valid component coverage).
# Calibration success IDs and current onsets are read only from labels below.
schema_version: 1
evaluation_protocol: lerobot/configs/benchmark/evaluation_protocol.yaml
labels: lerobot/configs/benchmark/prl_episode_labels.yaml
alpha: 0.05
score_seed: 0
score_batch_size: 1
# Offline throughput settings profiled on RTX 5090, K=4/L=4. Not online batching.
# CLI --batch-size overrides these; tasks may also define score_batch_sizes.
# RND stays at 1: BF16 residual scores were sensitive to batch-dependent kernels.
score_batch_sizes:
  wm_nc: 8
  wm_pe: 8
  wm_pu: 8
  logpzo: 128
  logpzo_native: 128
  rnd: 1
  rnd_native: 1
  ace: 32
paper_protocol:
  smoothing: trailing
  window: 1
  wm_frame_policy: all_endpoints
  frame_limits:
    - {task: needle_pickup, episode_index: 5, raw_frame_stop: 122}
latency_protocol:
  smoothing: trailing
  window: 1
  wm_frame_policy: all_endpoints
  frame_limits:
    - {task: needle_pickup, episode_index: 5, raw_frame_stop: 122}
