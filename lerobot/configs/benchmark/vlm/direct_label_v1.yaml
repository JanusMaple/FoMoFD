# Protocol specification only. No VLM runner/adapter is implemented by this file.
# Paths are repository-relative. Do not pass this to online_benchmark.py.
schema_version: 1
protocol_id: vlm_visual_failure_k4_l4_direct_label_v1
status: draft
execution_enabled: false
implementation_status: protocol_only
description: Sentinel-inspired task-informed visual failure detection, direct-label mode
reproduction_boundary: >-
  Adaptation of Sentinel's VLM monitoring idea. This is neither a full Sentinel
  reproduction nor an evaluation of Cosmos with its long-form reasoning recipe.

environment: fomofd-vlm
environment_spec: lerobot/environments/fomofd-vlm.yml
prompt_file: lerobot/configs/benchmark/vlm/prompt.txt
task_definitions: lerobot/configs/benchmark/vlm/tasks.yaml
labels_for_selection_and_reporting_only: lerobot/configs/benchmark/prl_episode_labels.yaml
main_wm_reference: lerobot/configs/benchmark/unified_benchmark.yaml

models:
  qwen3_vl_8b_instruct:
    repo_id: Qwen/Qwen3-VL-8B-Instruct
    revision: 0c351dd01ed87e9c1b53cbc748cba10e6187ff3b
    path: fomofd/model/vlm/Qwen/Qwen3-VL-8B-Instruct
  cosmos_reason2_8b:
    repo_id: nvidia/Cosmos-Reason2-8B
    revision: a9fae2cf89dc64db96b12860417f0eb403013bb9
    path: fomofd/model/vlm/nvidia/Cosmos-Reason2-8B

inputs:
  K: 4
  L: 4
  index_space: position_within_prepared_episode
  frame_offsets_from_endpoint: [-7, -6, -5, -4, 0]
  first_eligible_endpoint: 7
  map_to_raw_with: observation.raw_frame_index
  timestamp_column: observation.wall_timestamp
  raw_timestamp_key: timestamps
  timestamp_origin: first_raw_recording_wall_timestamp
  timestamp_display_decimals: 3
  retain_full_precision_timestamps_in_trace: true
  gap: wall_time_frame_5_minus_wall_time_frame_4
  input_modality: five_independent_rgb_images
  views: [fix, wrist]
  view_policy: separate_replay_per_view
  raw_image_keys: {fix: images_fix, wrist: images_wrist}
  action_inputs: false
  state_inputs: false
  use_vae_or_dinov2_features: false
  access_to_other_view: false
  pad_missing_history: false
  uniform_fps_video_conversion: false

prompt_assembly:
  chat_template: pinned_local_processor
  system_message: null
  add_generation_prompt: true
  history_across_requests: false
  user_content_order: prompt_text_then_five_labeled_image_blocks
  image_block_text: "Frame {number}: {timestamp} seconds"
  task_specific_definitions: shared_visual_rules_then_all_task_failure_definitions
  same_task_text_for_both_models_and_both_views: true
  include_episode_ids_or_filenames: false
  include_episode_outcome_or_failure_group: false
  include_onset_or_failure_origin: false
  include_nominal_or_final_episode_duration: false

preprocessing:
  helper: qwen_vl_utils.process_vision_info
  image_patch_size: 16
  min_pixels_per_image: 4096
  max_pixels_per_image: 262144
  preserve_aspect_ratio: true
  crop: false
  stitch_views_or_frames: false
  timestamp_overlay_on_pixels: false
  # qwen-vl-utils resizes once to multiples of 32; preserve small native images.
  processor_do_resize: false
  record_original_and_processed_shapes: true
  record_image_grid_and_visual_token_counts: true

inference:
  device: cuda:0
  dtype: bfloat16
  attention: sdpa
  eval_mode: true
  inference_mode: true
  local_files_only: true
  cpu_offload: false
  quantization: null
  compile: false
  window_batch_size: 1
  concurrent_requests: 1
  resident_models: 1
  seed: 0
  matmul_precision: highest
  tf32: false
  cache_visual_embeddings_between_requests: false
  cache_kv_between_requests: false

generation:
  do_sample: false
  num_beams: 1
  max_new_tokens: 8
  use_cache: true
  temperature: null
  top_p: null
  top_k: null
  repetition_penalty: 1.0
  output_scores: false
  reasoning_prompt: false
  # No assumed enable_thinking flag: the pinned chat templates do not use it.
  label_constraint:
    implementation: tokenizer_derived_prefix_trie
    allowed_strings: [FAIL, NORMAL]
    require_eos_after_complete_label: true
    eos_token_ids_source: pinned_model_generation_config
    validate_token_roundtrip_and_budget_before_run: true
    assume_single_token_labels: false
  invalid_output_policy: record_error_and_stop_run
  retry_invalid_outputs_inside_timed_stream: false

streaming:
  clock: recorded_wall_time
  replay_speed: 1.0
  scheduling: latest_available_eligible_endpoint
  snapshot_endpoint_before_processing: true
  pending_window_queue: false
  process_same_endpoint_twice: false
  processing_includes:
    - prompt_render_and_image_selection
    - resize_and_processor
    - host_to_device
    - vision_encoding_and_language_prefill
    - label_generation_and_gpu_synchronization
    - label_parsing_and_alarm_dispatch
  outside_timer: [model_loading, warmup, raw_episode_decode_to_cpu_ram, disk_writes]
  precompute_future_image_features: false
  warmup_source: calibration_success_only
  warmup_windows: 3
  reset_request_and_episode_state: true
  stop_at_first_FAIL: true
  continue_NORMAL_until_source_exhausted: true
  drain_last_available_endpoint: true
  report_alarm_completions_after_source_end_separately: true

evaluation:
  # Proposed VLM scope; no launch is authorized by this draft configuration.
  # A WM-based skip mask must not determine which failures these new models see.
  selection: all_test_episodes
  skip_based_on_wm_or_other_detector_results: false
  test_success_range_inclusive: [19, 38]
  excluded_calibration_range_inclusive: [0, 18]
  expected_counts_per_model_view:
    needle_pickup: {success: 20, failure: 120}
    ring_over_post: {success: 20, failure: 120}
    tissue_retraction: {success: 20, failure: 40}
    shunt_insertion: {success: 20, failure: 40}
  expected_replays_all_models_views_tasks: 1600
  decision: first_generated_FAIL
  smoothing: none
  consecutive_FAILs_required: 1
  calibration_protocol: none_direct_label
  matched_far: false
  continuous_score: null
  episode_auroc: null
  primary_annotator_id: annotator_ba960a25a7cc
  onset_view: same_as_detector_view
  deadline_seconds: [1, 2, 5, 10]
  report: [FAR, FDR_any_alarm, pre_onset_alarms, pre_onset_evidence,
           post_onset_detections, misses, deadline_rates, conditional_delay,
           errors, invalid_outputs, processed_and_skipped_endpoints, source_age]
  shared_episode_latency: intersect_post_onset_detections_with_same_onset_reference
  never_impute_unmeasured_wm_online_results: true

outputs:
  per_task_root: fomofd/tasks/{task}/prl_data/score_result/vlm_online/{run_id}
  report_root: fomofd/tasks/benchmark_results/vlm_online/{run_id}
  console_logs: logs/benchmarks/{date}/vlm_online/{run_id}
  preserve_existing_results: true
  immutable_run_identity:
    - model_revision_and_weight_checksums
    - prompt_and_task_definition_hashes
    - full_resolved_protocol_and_environment
    - dataset_mapping_and_timestamp_provenance
    - report_label_and_onset_snapshot_hash
  retain_per_request: [prepared_and_raw_frame_indices, full_precision_timestamps,
                       rendered_prompt, generated_token_ids, raw_response, parsed_label,
                       image_shapes_and_grids, stage_times, peak_gpu_memory,
                       endpoint_source_time, processing_start_time, alarm_ready_time]
