      - fomofd/tasks/ring_over_post/model/act_dinov2_ensemble/act_dinov2_weak_state_both_chunk4_seed1001/checkpoints/last/pretrained_model/model.safetensors
      - fomofd/tasks/ring_over_post/model/act_dinov2_ensemble/act_dinov2_weak_state_both_chunk4_seed1002/checkpoints/last/pretrained_model/model.safetensors
  tissue_retraction:
