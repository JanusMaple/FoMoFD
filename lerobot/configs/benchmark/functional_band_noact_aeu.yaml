protocols: [episode, wall_time_bin, functional_band]
template:
  grid_seconds: 1.0
  modulation: constant
  scale_floor: 1.0e-6
wall_time_bin:
  bin_seconds: 1.0
deadline_seconds: [1.0, 2.0, 5.0, 10.0]
