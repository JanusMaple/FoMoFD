# All 8 expert-score/template jobs completed on 2026-10-20; reuse cached scores.
# No inference is performed unless --allow-inference is explicitly supplied.
# Freeze these expert-only template settings before evaluating PRL failures.
schema_version: 1
catalog: lerobot/configs/benchmark/results_catalog.yaml
labels: lerobot/configs/benchmark/prl_episode_labels.yaml
evaluation_protocol: lerobot/configs/benchmark/evaluation_protocol_v3.yaml
