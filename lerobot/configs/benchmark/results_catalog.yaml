training_setup:
  verified_date: '2026-10-18'
  scope: Original ACT policies at checkpoint 200000, their fixed/wrist visual feature
    VAEs, and full-data main FM-WM splits.
  demonstration_operators:
    total_distinct_people: 1
    same_person_across_tasks: true
  tasks:
  - task: needle_pickup
    label: Needle Pickup
    expert_episodes: 250
    operators: 1
    act_train_episodes: 250
    act_val_episodes: 0
    visual_vae_train_episodes: 225
    visual_vae_val_episodes: 25
    wm_train_episodes: 225
    wm_val_episodes: 25
  - task: ring_over_post
    label: Ring Over Post
    expert_episodes: 250
    operators: 1
    act_train_episodes: 250
    act_val_episodes: 0
    visual_vae_train_episodes: 225
    visual_vae_val_episodes: 25
    wm_train_episodes: 225
    wm_val_episodes: 25
  - task: tissue_retraction
    label: Tissue Retraction
    expert_episodes: 100
    operators: 1
    act_train_episodes: 100
    act_val_episodes: 0
    visual_vae_train_episodes: 90
    visual_vae_val_episodes: 10
    wm_train_episodes: 90
    wm_val_episodes: 10
  - task: shunt_insertion
    label: Shunt Insertion
    expert_episodes: 100
    operators: 1
    act_train_episodes: 100
    act_val_episodes: 0
    visual_vae_train_episodes: 90
    visual_vae_val_episodes: 10
    wm_train_episodes: 90
    wm_val_episodes: 10
  act:
    dinov2_model_name: dinov2_vitb14_reg
    backbone: DINOv2 ViT-B/14 with registers
    backbone_frozen: true
    patch_tokens_per_view:
    - 256
    - 768
    compressed_tokens_per_view:
    - 16
    - 768
    summary: ACT used all expert episodes with no held-out expert validation split.
      Its jointly trained action VAE used the same full population. The DINOv2 ViT-B/14-with-registers
      backbone (dinov2_vitb14_reg) was frozen, not fine-tuned; final-layer normalized
      patch features (256 x 768 per view at 224 x 224 input) fed trainable camera
      token compressors (16 x 768 per view) and the trainable ACT policy.
  visual_vae:
    split_unit: episode
    val_ratio: 0.1
    split_seed: 0
    identical_to_main_wm_episode_ids: true
    summary: The separate fixed/wrist visual feature VAEs used disjoint 90/10 episode
      splits, with split seed 0. Both cameras and the main FM-WM used identical train/validation
      episode IDs within each task. These VAEs are distinct from ACT's action VAE.
  interpretation: One person collected all four expert datasets; the quantity ablation
    does not test operator diversity. Validation is stage-specific, since ACT was
    trained on all expert episodes, including those held out for visual-VAE/FM-WM
    validation.
