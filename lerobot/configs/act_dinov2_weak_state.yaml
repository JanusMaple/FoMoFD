policy:
  type: act_dinov2
  push_to_hub: false

  input_features:
    observation.images.fix_camera:
      type: VISUAL
      shape: [3, 224, 224]
    observation.images.wrist_camera:
      type: VISUAL
      shape: [3, 224, 224]
    observation.state:
      type: STATE
      shape: [10]

  output_features:
    action:
      type: ACTION
      shape: [10]

  # DINOv2 Specifics
  dinov2_model_name: dinov2_vitb14_reg
  dinov2_feature_dim: 768

  # Camera selection
  use_fix_camera: true
  use_wrist_camera: true

  # State usage
  use_robot_state_in_policy: true
  use_robot_state_in_vae: true

  # Weak-state controls
  state_scale: 0.2
  state_dropout_prob: 0.5
  state_noise_std: 0.01

  # ACT Specifics
  dim_model: 768
  per_camera_num_queries: 16
  camera_embed_init_std: 0.02
  use_cls_token: false
  robot_state_token_repetition: 1
  use_2d_pos_emb: false
  n_decoder_layers: 7
  n_encoder_layers: 4
  n_vae_encoder_layers: 4
  latent_dim: 64

  n_action_steps: 1
  chunk_size: 4
  temporal_ensemble_coeff: 0.001